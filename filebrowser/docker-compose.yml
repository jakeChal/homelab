services:
  filebrowser:
    image: filebrowser/filebrowser:${FILEBROWSER_VERSION:-v2.63.14}
    container_name: filebrowser
    restart: unless-stopped
    user: root
    ports: # remove once we settle with caddy
      - "8081:80"
    volumes:
      - /mnt/backup/all/Backups:/srv
      - filebrowser_data:/data
    environment:
      - FB_DATABASE=/data/filebrowser.db

volumes:
  filebrowser_data:
